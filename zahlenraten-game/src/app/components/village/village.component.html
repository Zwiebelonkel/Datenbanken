
<div class="village-container" *ngIf="!isLoading">
  <h2>🏡 Dein Dorf</h2>

  <p>💰 Aktuelles Geld: {{ money | number:'1.2-2' }} €</p>

  <div *ngIf="earned > 0">
    <p>⏱️ Inaktivzeit: {{ minutesPassed }} Minuten</p>
    <p>📈 Einkommen in dieser Zeit: +{{ earned | number:'1.2-2' }} €</p>
  </div>

  <p>🏘️ Dorf-Level: {{ villageLevel }}</p>
  <p>👥 Bewohner: {{ villagers.length }}</p>

  <button disabled class="btn">Dorf verbessern (kommt bald)</button>
  <button disabled class="btn">Bewohner verbessern (kommt bald)</button>
</div>
  <!-- 👉 CANVAS NACH UNTEN -->
  <canvas #villageCanvas width="400" height="400"></canvas>
<app-loader *ngIf="isLoading" />
