<!-- Box: Dorfinfo -->
<div class="village-box" *ngIf="!isLoading">
  <h2>🏡 Dein Dorf</h2>

  <div class="info-row">
    <span>💰 Aktuelles Geld:</span>
    <span><strong>{{ money | number:'1.2-2' }} €</strong></span>
  </div>

  <div class="info-row" *ngIf="earned > 0">
    <span>⏱️ Inaktivzeit:</span>
    <span>{{ minutesPassed }} Minuten</span>
  </div>

  <div class="info-row" *ngIf="earned > 0">
    <span>📈 Einkommen in dieser Zeit:</span>
    <span>+{{ earned | number:'1.2-2' }} €</span>
  </div>

  <div class="info-row">
    <span>🏘️ Dorf-Level:</span>
    <span>{{ villageLevel }}</span>
  </div>

  <div class="info-row">
    <span>👥 Bewohner:</span>
    <span>{{ villagers.length }}</span>
  </div>
</div>

<!-- Box: Canvas -->
<div class="village-box canvas-box">
  <canvas #villageCanvas width="400" height="400"></canvas>
</div>

<!-- Box: Buttons (später aktivierbar) -->
<!-- Box: Buttons -->
<div class="village-box">
  <button
    class="btn"
    [disabled]="money < villageLevel * 100 || isLoading"
    (click)="upgrade()"
  >
    ⬆️ Dorf verbessern ({{ villageLevel * 100 }} €)
  </button>

  <button disabled class="btn">💪 Bewohner verbessern (kommt bald)</button>
</div>

<app-loader *ngIf="isLoading" />
