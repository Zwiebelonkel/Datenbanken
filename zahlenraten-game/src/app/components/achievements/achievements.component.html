<app-sidebar></app-sidebar>
<app-topbar page="🎖️ Erfolge"></app-topbar>

<div class="card achievement-container">
  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="loader-container">
    <div class="loader"></div>
  </div>
  <ul>
    <li *ngFor="let ach of achievements" [class.locked]="!ach.unlocked">
      <span class="icon">{{ ach.unlocked ? "✅" : "🔒" }}</span>
      <div>
        <p>
          <strong>{{ ach.name }}</strong>
        </p>
        <p>{{ ach.description }}</p>
      </div>
    </li>
  </ul>
</div>
