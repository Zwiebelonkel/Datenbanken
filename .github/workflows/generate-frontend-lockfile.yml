name: Generate frontend package-lock.json

on:
  workflow_dispatch:

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm install (create lockfile)
        working-directory: zahlenraten-game
        run: npm install

      - name: Commit lockfile
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(frontend): add package-lock.json"
          file_pattern: backend/package-lock.json
