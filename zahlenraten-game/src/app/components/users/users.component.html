<div class="card highscores-carousel">
  <div class="users-header">
    <h3>👤 Spieler</h3>
  </div>

  <button
    class="toggle-btn btn"
    (click)="toggleLevelList()"
    [class.open]="isLevelListOpen"
    [attr.aria-expanded]="isLevelListOpen"
    type="button"
  >
    <ng-container *ngIf="isLevelListOpen; else collapsed">
      <!-- Pfeil nach oben (Einklappen) -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#e3e3e3"
        style="vertical-align: middle; margin-right: 0.5rem"
      >
        <path d="m296-345-56-56 240-240 240 240-56 56-184-183-184 183Z" />
      </svg>
      Liste einklappen
    </ng-container>

    <ng-template #collapsed>
      <!-- Pfeil nach unten (Ausklappen) -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#e3e3e3"
        style="vertical-align: middle; margin-right: 0.5rem"
      >
        <path d="M480-345 240-585l56-56 184 183 184-183 56 56-240 240Z" />
      </svg>
      Alle Spieler anzeigen
    </ng-template>
  </button>

  <app-loader *ngIf="loadingLevels" aria-live="polite"></app-loader>

  <!-- Animierbarer Container -->
  <div
    class="level-list"
    [class.expanded]="isLevelListOpen"
    [attr.aria-hidden]="!isLevelListOpen"
  >
    <!-- Liste -->
    <ul *ngIf="!loadingLevels && levelUsers?.length">
      <li
        *ngFor="let u of levelUsers; trackBy: trackByUsername"
        (click)="goToProfile(u.username)"
        tabindex="0"
        role="button"
      >
        <img
          class="avatar"
          [src]="avatar(u.profileImageUrl, 32)"
          width="32"
          height="32"
          (error)="onAvatarError($event)"
          alt=""
        />
        <span>{{ u.username }}</span>
        <strong>Lvl {{ u.level }} • {{ u.xpPercent }}%</strong>
      </li>
    </ul>

    <p *ngIf="!loadingLevels && !levelUsers.length" style="color: gray">
      Keine Spieler gefunden…
    </p>

    <!-- Pagination (Server) -->
    <div
      class="pagination"
      *ngIf="!loadingLevels && total > pageSize"
      aria-label="Spieler-Seitensteuerung"
    >
      <button class="page-btn btn" (click)="prevPage()" [disabled]="!hasPrev">
        ◀︎ Zurück
      </button>

      <span class="page-info">
        Seite {{ page }} / {{ totalPages }} · {{ (page - 1) * pageSize + 1 }}–{{
          Math.min(page * pageSize, total)
        }}
        von {{ total }}
      </span>

      <button class="page-btn btn" (click)="nextPage()" [disabled]="!hasNext">
        Weiter ▶︎
      </button>
    </div>
  </div>
</div>
