<div class="slot-container">
  <div class="slot-header">
    <h2>🎰 Slot Machine</h2>
  </div>

  <div class="slot-reels">
    <app-reel
      *ngFor="let reel of reels; let i = index"
      [symbol]="results[i] || '❔'"
      #reelComp
    ></app-reel>
  </div>

  <button (click)="spin()">Spin</button>

  <div *ngIf="results.length" class="slot-result">
    Ergebnis: {{ results.join(' | ') }}
  </div>
</div>
