<div
  class="sidebar-toggle"
  *ngIf="authService.isLoggedIn()"
  (click)="toggleSidebar()"
>
  ☰
</div>

<div class="sidebar" [class.open]="sidebarOpen">
  <button *ngIf="isPageEnabled('home')" (click)="goHome()">🏠 Home</button>
  <button *ngIf="isPageEnabled('achievements')" (click)="goToAchievements()">
    🎖️ Erfolge
  </button>
  <button *ngIf="isPageEnabled('profile')" (click)="goToProfile()">
    👤 Profil
  </button>
  <button
    *ngIf="authService.getRole()?.toLowerCase() === 'admin'"
    (click)="goToAdmin()"
  >
    🛠️ Admin
  </button>
  <button *ngIf="isPageEnabled('slots')" (click)="goToSlots()">🎰 Slots</button>
  <button *ngIf="isPageEnabled('village')" (click)="goToVillage()">
    🛖 Dorf
  </button>
  <button *ngIf="isPageEnabled('tutorial')" (click)="howToPlay()">
    ❓ Tutorial
  </button>
  <button
    *ngIf="isPageEnabled('clicker')"
    [disabled]="achAmount < 3"
    (click)="goToClicker()"
  >
    💰 Clicker
  </button>
  <button *ngIf="isPageEnabled('shop')" (click)="shop()">🃏 Karten</button>
  <button (click)="logout()">🚪 Logout</button>
</div>
