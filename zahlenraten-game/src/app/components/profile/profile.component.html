<app-sidebar></app-sidebar>

<div class="profile-container">
  <!-- Avatar + Name -->
  <div class="profile-avatar">
    <div class="avatar-frame" [class.view-only]="!isOwnProfile">
      <img [src]="profileImage" alt="Profilbild" />

      <button
        *ngIf="isOwnProfile"
        class="edit-overlay"
        type="button"
        (click)="fileInput.click()"
        aria-label="Profilbild ändern"
      >
        <span class="camera">📷</span>
        <span>Bild ändern</span>
      </button>

      <input
        #fileInput
        class="hidden-input"
        type="file"
        accept="image/*"
        (change)="onFileSelected($event)"
      />
    </div>

    <h2 class="display-name">{{ username }}</h2>
    <!-- <div class="handle">{{ username }}</div> -->
  </div>

  <!-- Loader -->
  <app-loader *ngIf="isLoading"></app-loader>

  <!-- Statistiken -->
  <div *ngIf="!isLoading" class="profile-card">
    <h3>📊 Statistiken</h3>

    <div class="stat-row">
      <span>💠 Highscore</span>
      <span>{{ highscore }}</span>
    </div>
    <div class="stat-row">
      <span>🏆 Punkte</span>
      <span>{{ totalScore }}</span>
    </div>
    <div class="stat-row">
      <span>🎮 Partien</span>
      <span>{{ totalGames }}</span>
    </div>
    <div class="stat-row">
      <span>😊 Erfolge</span>
      <span>{{ unlockedAchievements }}</span>
    </div>
    <div class="stat-row">
      <span>💰 Geld</span>
      <span>{{ money | number : "1.2-2" }}</span>
    </div>
  </div>

  <!-- Passwort ändern (nur eigenes Profil) -->
  <div *ngIf="isOwnProfile && !isLoading" class="password-change-box">
    <h3>🔐 Passwort ändern</h3>

    <input
      [(ngModel)]="currentPassword"
      type="password"
      placeholder="Aktuelles Passwort"
    />
    <input
      [(ngModel)]="newPassword"
      type="password"
      placeholder="Neues Passwort"
    />
    <input
      [(ngModel)]="repeatPassword"
      type="password"
      placeholder="Neues Passwort wiederholen"
    />

    <button (click)="changePassword()">Ändern</button>

    <div *ngIf="pwChangeSuccess" class="success-msg">
      ✅ Passwort erfolgreich geändert
    </div>
    <div *ngIf="!pwChangeSuccess && pwChangeMsg" class="error-msg">
      {{ pwChangeMsg }}
    </div>
  </div>
</div>
