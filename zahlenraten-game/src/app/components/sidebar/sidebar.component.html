<div class="sidebar" [class.open]="sidebarOpen">
  <!-- Wenn eingeloggt: normale Buttons -->
  <ng-container *ngIf="authService.isLoggedIn(); else loginView">
    <button *ngIf="isPageEnabled('home')" (click)="goHome()">🏠 Home</button>
    <button *ngIf="isPageEnabled('achievements')" (click)="goToAchievements()">🎖️ Erfolge</button>
    <button *ngIf="isPageEnabled('profile')" (click)="goToProfile()">👤 Profil</button>
    <button *ngIf="authService.getRole()?.toLowerCase() === 'admin'" (click)="goToAdmin()">🛠️ Admin</button>
    <button *ngIf="isPageEnabled('slots')" (click)="goToSlots()">🎰 Slots</button>
    <button *ngIf="isPageEnabled('village')" (click)="goToVillage()">🛖 Dorf</button>
    <button *ngIf="isPageEnabled('tutorial')" (click)="howToPlay()">❓ Tutorial</button>
    <button *ngIf="isPageEnabled('clicker')" (click)="goToClicker()" [disabled]="achAmount < 3">💰 Clicker</button>
    <button *ngIf="isPageEnabled('shop')" (click)="shop()">🃏 Karten</button>
    <button *ngIf="isPageEnabled('skillShop')" (click)="skillShop()">⬆️ Skills</button>
    <button (click)="logout()">🚪 Logout</button>
  </ng-container>

  <!-- Wenn NICHT eingeloggt: Login View -->
  <ng-template #loginView>
    <div class="login-overlay">
      <button class="login-button" (click)="goToLogin()">🔐 Login</button>
    </div>
  </ng-template>
</div>
