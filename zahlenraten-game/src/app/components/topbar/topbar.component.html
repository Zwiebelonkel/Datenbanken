<div class="topbar">
  <!-- Zurück-Button, unabhängig vom Titel -->
  <button
    *ngIf="authService.isLoggedIn() && showBackButton"
    class="back-button"
    (click)="goBack()"
    aria-label="Zurück"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      height="24px"
      viewBox="0 -960 960 960"
      width="24px"
      fill="currentColor"
    >
      <path d="M400-80 0-480l400-400 71 71-329 329 329 329-71 71Z" />
    </svg>
  </button>

  <!-- Titel: links bei Willkommen, sonst zentriert -->
  <h1 class="page-title" [class.left-align]="isWelcomeTitle">
    <ng-container *ngIf="authService.isLoggedIn(); else guest">
      {{ page }}
    </ng-container>
    <ng-template #guest>
      <strong>🃏 CardCore ♦️</strong>
    </ng-template>
  </h1>

  <!-- Platzhalter rechts, damit Centering stabil bleibt -->
  <div class="topbar-spacer" aria-hidden="true"></div>
</div>
