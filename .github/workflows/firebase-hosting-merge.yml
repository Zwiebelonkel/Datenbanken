name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [ Angular-SSR-(NurFuerBots) ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zahlenraten-game   # <— WICHTIG
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: zahlenraten-game/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (Angular)
        run: npx ng build --configuration production

      - name: Scully routes
        run: npx scully --scanRoutes --project zahlenraten-game --configFile scully.zahlenraten-game.config.ts

      - name: Prerender (Scully)
        run: npx scully --project zahlenraten-game --configFile scully.zahlenraten-game.config.ts

      - name: Debug dist
        run: |
          echo "--- dist tree ---"
          find dist -maxdepth 3 -type d -print
          echo "--- static indexes ---"
          find dist/static -maxdepth 3 -name index.html -print

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OUTSIDE___BETWEEN }}
          projectId: outside---between
          channelId: live
          entryPoint: zahlenraten-game   # <— firebase.json liegt hier