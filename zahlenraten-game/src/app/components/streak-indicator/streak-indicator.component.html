<div class="streak-container">
  <svg class="progress-ring" width="40" height="40" viewBox="0 0 44 44">
    <circle
      class="progress-ring__background"
      stroke="#eee"
      stroke-width="5"
      fill="transparent"
      r="18"
      cx="22"
      cy="22"
    />
    <circle
      class="progress-ring__circle"
      stroke="#cc4444"
      stroke-width="5"
      fill="transparent"
      r="18"
      cx="22"
      cy="22"
      [attr.stroke-dasharray]="circleCircumference"
      [attr.stroke-dashoffset]="strokeDashOffset"
    />
  </svg>
  <div class="streak-text">❤</div>
</div>
