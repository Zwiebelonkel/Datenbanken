<div class="card chat-box" [class.expanded]="isExpanded">
  <div class="chat-header">
    <h3>💬 Globaler Chat</h3>
  </div>

  <button
    class="toggle-btn"
    type="button"
    (click)="toggleExpanded()"
    [attr.aria-expanded]="isExpanded"
  >
    {{ isExpanded ? '⬆️ Einklappen' : '⬇️ Ausklappen' }}
  </button>

  <!-- NICHT mit *ngIf ausblenden, damit die Transition läuft -->
  <div class="chat-content" [attr.aria-hidden]="!isExpanded">
    <div class="messages" #messageContainer>
      <div
        class="message"
        *ngFor="let msg of messages; trackBy: trackByMsg"
        [ngClass]="{
          'user-message': msg.username === username,
          'admin-message': msg.username === 'admin',
          'info-message': msg.username === 'Info',
          'other-message': msg.username !== username && msg.username !== 'admin' && msg.username !== 'Info'
        }"
      >
        <div class="message-content">
          <span class="user"><b>{{ msg.username }}</b></span>
          <span class="text">{{ msg.message }}</span>
          <span class="timestamp">{{ msg.created_at | date:'HH:mm' }}</span>
        </div>
      </div>
    </div>

    <form (ngSubmit)="sendMessage()" class="chat-form">
      <input [(ngModel)]="newMessage" name="message" placeholder="Nachricht schreiben..." />
      <button class="send-btn" [disabled]="newMessage.trim()===''" type="submit">📤 Senden</button>
    </form>
  </div>
</div>
