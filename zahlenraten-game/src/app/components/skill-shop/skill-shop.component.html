<div class="skill-shop">
  <h2>Skill-Shop</h2>

  <!-- Anzeige der Spieler-Info -->
  <div class="player-info">
    <p><strong>Skillpunkte:</strong> {{ player.skillPoints }}</p>
    <p><strong>Score Multiplikator:</strong> {{ player.scoreMultiplier }}x</p>
    <p><strong>Monetary Multiplikator:</strong> {{ player.monetaryMultiplier }}x</p>
  </div>

  <!-- Skill-Items -->
  <div *ngFor="let skill of skills">
    <h3>{{ skill.name }}</h3>
    <p>{{ skill.description }}</p>
    <p><strong>Preis:</strong> {{ skill.price }}</p>
    <button (click)="upgrade(skill)" [disabled]="skill.purchased || player.skillPoints < skill.price">
      {{ skill.purchased ? 'Gekauft' : 'Upgrade' }}
    </button>
  </div>
</div>
