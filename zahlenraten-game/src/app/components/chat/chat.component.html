<div class="card chat-box" [class.expanded]="isExpanded">
  <div class="chat-header">
    <h3>💬 Globaler Chat</h3>
  </div>

  <button
    class="toggle-btn btn"
    type="button"
    (click)="toggleExpanded()"
    [class.open]="isExpanded"
    [attr.aria-expanded]="isExpanded"
  >
    <ng-container *ngIf="isExpanded; else collapsed">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#e3e3e3"
      >
        <path d="m296-345-56-56 240-240 240 240-56 56-184-183-184 183Z" />
      </svg>
      Einklappen
    </ng-container>
    <ng-template #collapsed>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        height="24px"
        viewBox="0 -960 960 960"
        width="24px"
        fill="#e3e3e3"
        style="vertical-align: middle"
      >
        <path d="M480-345 240-585l56-56 184 183 184-183 56 56-240 240Z" />
      </svg>
      Ausklappen
    </ng-template>
  </button>

  <!-- NICHT mit *ngIf ausblenden, damit die Transition läuft -->
  <div class="chat-content" [attr.aria-hidden]="!isExpanded">
    <app-loader *ngIf="isLoading"></app-loader>
    <div class="messages" #messageContainer>
      <div
        class="message"
        *ngFor="let msg of messages; trackBy: trackByMsg"
        [ngClass]="{
          'user-message': msg.username === username,
          'admin-message': msg.username === 'admin',
          'info-message': msg.username === 'Info',
          'other-message':
            msg.username !== username &&
            msg.username !== 'admin' &&
            msg.username !== 'Info'
        }"
      >
        <div class="message-content">
          <span class="user"
            ><b>{{ msg.username }}</b></span
          >
          <span class="text">{{ msg.message }}</span>
          <span class="timestamp">{{ msg.created_at | date : "HH:mm" }}</span>
        </div>
      </div>
    </div>

    <form (ngSubmit)="sendMessage()" class="chat-form">
      <input
        [(ngModel)]="newMessage"
        name="message"
        placeholder="Nachricht schreiben..."
      />
      <button
        class="send-btn"
        [disabled]="newMessage.trim() === ''"
        type="submit"
      >
        📤 Senden
      </button>
    </form>
  </div>
</div>
