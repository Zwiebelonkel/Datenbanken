<div class="skillshop">
  <h2>SkillShop</h2>

  <!-- Anzeige der Spieler-Info -->
  <div class="player-info">
    <p><strong>Skillpunkte:</strong> {{ player.skillPoints }}</p>
    <p><strong>Score Multiplikator:</strong> {{ player.scoreMultiplier }}x</p>
    <p><strong>Monetary Multiplikator:</strong> {{ player.monetaryMultiplier }}x</p>
  </div>

  <!-- Skill-Items -->
  <div class="skill-card" *ngFor="let skill of skills">
    <h3>{{ skill.name }}</h3>
    <p>{{ skill.description }}</p>
    <p><strong>Preis:</strong> {{ skill.price | currency:'EUR' }}</p>
    <button (click)="purchase(skill)" [disabled]="skill.purchased || player.skillPoints < skill.price">
      {{ skill.purchased ? 'Gekauft' : 'Kaufen' }}
    </button>
  </div>

  <!-- Beispiel für Upgrades -->
  <div class="upgrade-section">
    <h3>Upgrades</h3>

    <button (click)="purchase({
      id: 1,
      name: 'Score Multiplikator +1',
      price: 50,
      purchased: false,
      level: 1,
      type: 'score',
      description: 'Erhöhe deinen Score-Multiplikator um 1x'
    })">
      Score Multiplikator upgraden
    </button>
    <button (click)="purchase({
      id: 2,
      name: 'Monetary Multiplikator +0.5x',
      price: 40,
      purchased: false,
      level: 1,
      type: 'money',
      description: 'Erhöhe deinen monetären Multiplikator um 0.5x'
    })">
      Monetary Multiplikator upgraden
    </button>
  </div>
</div>
