<app-sidebar></app-sidebar>
<app-topbar page="📈 Scoreverlauf"></app-topbar>

<div class="profile-container">
  <!-- Loading/Error -->
  <app-loader *ngIf="loading"></app-loader>
  <div *ngIf="error" class="error-msg">{{ error }}</div>

  <div class="user-select-row">
    <label for="user2">Vergleichen mit:</label>
    <select id="user2" [(ngModel)]="secondUsername" (change)="loadSecondUser()">
      <option [ngValue]="null">– Kein zweiter Benutzer –</option>
      <option *ngFor="let user of otherUsers" [ngValue]="user">
        {{ user }}
      </option>
    </select>
  </div>

  <div *ngIf="!loading && !error" class="card profile-card">
    <h3>📈 Scoreverlauf von {{ username }}</h3>

    <canvas
      baseChart
      [datasets]="lineChartData"
      [labels]="lineChartLabels"
      [options]="lineChartOptions"
      [type]="lineChartType"
    ></canvas>
  </div>
</div>
<app-tutorial
  [title]="tutorialTitle"
  [description]="tutorialDescription"
></app-tutorial>
