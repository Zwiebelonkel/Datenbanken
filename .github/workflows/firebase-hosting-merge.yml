name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - 3D-packOpening


jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📥 Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('zahlenraten-game/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 📥 Install dependencies
        run: npm ci
        working-directory: zahlenraten-game

      - name: 🛠️ Build project
        run: npm run build
        working-directory: zahlenraten-game

      - name: 🚀 Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OUTSIDE___BETWEEN }}
          channelId: live
          projectId: outside---between
