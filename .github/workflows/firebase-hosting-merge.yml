# .github/workflows/firebase-hosting-merge.yml
name: 🚀 Deploy to Firebase Hosting on merge

on:
  push:
    branches: [ Angular-SSR-(NurFuerBots) ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-deploy-${{ github.ref }}
      cancel-in-progress: true

    # Wir bauen im Subordner 'zahlenraten-game'
    defaults:
      run:
        working-directory: zahlenraten-game

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕️ Kaffee-Hinweis
        run: echo "hole dir einen kaffe, das wird lange dauern"

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: zahlenraten-game/package-lock.json

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🌐 Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: 🛠️ Build Angular (Prod)
        run: npx ng build --configuration production

      - name: 🔎 Scan Routes (Scully)
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npx scully --scanRoutes --project zahlenraten-game --configFile scully.zahlenraten-game.config.ts --serverTimeout=120000 --showGuessError

      - name: 🧱 Prerender with Scully
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npx scully --project zahlenraten-game --configFile scully.zahlenraten-game.config.ts --serverTimeout=120000

      - name: 🔍 Verify static output
        run: |
          echo "--- dist/static content ---"
          find dist/static -maxdepth 3 -name index.html -print
          test -f dist/static/index.html

      # Ab hier wieder im Repo-Root deployen (firebase.json liegt im Root)
      - name: 🚀 Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OUTSIDE___BETWEEN }}
          projectId: outside---between
          channelId: live
          entryPoint: .                  # <— WICHTIG: firebase.json im Root verwenden
          firebaseToolsVersion: latest