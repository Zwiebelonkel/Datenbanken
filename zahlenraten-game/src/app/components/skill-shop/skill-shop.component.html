<div class="skillshop">
  <h2>SkillShop</h2>
  <div class="skill-card" *ngFor="let skill of skills">
    <h3>{{ skill.name }}</h3>
    <p>{{ skill.description }}</p>
    <p><strong>Preis:</strong> {{ skill.price | currency:'EUR' }}</p>
    <button (click)="purchase(skill)" [disabled]="skill.purchased">
      {{ skill.purchased ? 'Gekauft' : 'Kaufen' }}
    </button>
  </div>
</div>
