<div class="skill-shop">
  <h2 class="shop-title">Skill-Shop</h2>

  <!-- Anzeige der Spieler-Info -->
  <div class="player-info">
    <div class="info-item">
      <span class="info-title">Skillpunkte:</span>
      <span class="info-value">{{ player.skillPoints }}</span>
    </div>
    <div class="info-item">
      <span class="info-title">Score Multiplikator:</span>
      <span class="info-value">{{ player.scoreMultiplier }}x</span>
    </div>
    <div class="info-item">
      <span class="info-title">Monetary Multiplikator:</span>
      <span class="info-value">{{ player.monetaryMultiplier }}x</span>
    </div>
  </div>

  <!-- Skill-Items -->
  <div *ngFor="let skill of skills" class="skill-item">
    <div class="skill-card">
      <div class="skill-header">
        <h3 class="skill-name">{{ skill.name }}</h3>
        <div class="skill-price">Preis: {{ skill.price }}<span class="currency">€</span></div>
      </div>
      <p class="skill-description">{{ skill.description }}</p>
      <button 
        (click)="upgrade(skill)" 
        [disabled]="skill.purchased || player.skillPoints < skill.price" 
        class="upgrade-button">
        {{ skill.purchased ? 'Gekauft' : 'Upgrade' }}
      </button>
    </div>
  </div>
</div>
