<div class="topbar">
  <div
    *ngIf="authService.isLoggedIn()"
    class="page-title"
    [ngClass]="{ 'left-align': page.startsWith('👤 Willkommen') }"
  >
    {{ page }}
  </div>
  <div *ngIf="!authService.isLoggedIn()" class="topbar-buttons">
    <button (click)="goToLogin()">🔐 Login</button>
  </div>
</div>
