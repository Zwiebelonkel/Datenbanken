<app-sidebar></app-sidebar>
<div class="opening-container">
    <p *ngIf="message" class="error">{{ message }}</p>
  <!-- 🟦 NEU: Pack-Overlay unabhängig -->
<div
  (click)="dropCardPack()"
  class="pack-cover-container"
  [class.disabled]="packDropped"
>
    <img
      *ngIf="showPack"
      [src]="packImagePath"
      alt="Pack Cover"
      class="pack-overlay"
      [class.drop]="packDropped"
    />
  </div>

<!-- 🎴 Gestapelte Karten -->
<div class="card-stack">
<div
  class="flip-card"
  *ngFor="let card of cardStack; let i = index; let last = last"
  [style.zIndex]="i + 1"
  [style.top.px]="i * 4"
  [style.left.px]="i * 2"
  [class.top-card]="last"
  [class.flipped]="last && reveal"
  [class.fly-away]="last && lastCardOut"
  (click)="last ? revealCard() : null"
>

    <div class="flip-inner">
      <div class="flip-front" [ngClass]="packName.toLowerCase()">
        <img src="assets/logo.png" class="logo center" />
      </div>
      <div class="flip-back" [ngClass]="packName.toLowerCase()">
        <img src="assets/logo.png" class="emoji top-left" />
        <img src="assets/logo.png" class="emoji bottom-right" />
        <p class="multiplier-text">{{ displayResult }}</p>
        <div class="sparkles"></div>
      </div>
    </div>
  </div>
</div>

  <!-- 🔁 Button zum direkten Umdrehen der nächsten Karte -->
  <button
    class="next-button"
    *ngIf="packDropped && cardsRemaining > 0 && reveal"
    (click)="revealNextCard()"
  >
    Nächste Karte
  </button>

  <!-- ✅ Hinweis, wenn alle Karten eines Packs aufgedeckt wurden -->
  <p class="finished" *ngIf="packDropped && cardsRemaining === 0">
    🎉 Alle Karten enthüllt!
  </p>

  <!-- 🃏 Zeige die bisher gezogenen Karten in einer Liste -->
  <ul class="drawn-cards" *ngIf="drawnCards.length > 0">
    <li *ngFor="let card of drawnCards">{{ card }}</li>
  </ul>

  <app-loader *ngIf="isLoading"></app-loader>
</div>
